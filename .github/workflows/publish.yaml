name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js + pnpm
        uses: uxiew/action-setup-node-pnpm@main
        with:
          node-version: "24"
          args: "--frozen-lockfile"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version check passed: $PKG_VERSION"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  publish-npm:
    name: Publish Packages
    needs: verify
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js + pnpm
        uses: uxiew/action-setup-node-pnpm@main
        with:
          node-version: "24"
          args: "--frozen-lockfile"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: pnpm build

      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

      - name: Skip publish (missing NPM_TOKEN)
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is empty, skip npm publish."

  create-github-release:
    name: Create GitHub Release
    needs:
      - verify
      - publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "## 📦 ${PKG_NAME}@${PKG_VERSION}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ -n "$PREV_TAG" ]; then
            echo "### What's Changed" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md

            # Features
            FEATURES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -E '^- feat' || true)
            if [ -n "$FEATURES" ]; then
              echo "#### ✨ Features" >> RELEASE_NOTES.md
              echo "$FEATURES" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
            fi

            # Bug Fixes
            FIXES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -E '^- fix' || true)
            if [ -n "$FIXES" ]; then
              echo "#### 🐛 Bug Fixes" >> RELEASE_NOTES.md
              echo "$FIXES" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
            fi

            # Refactors
            REFACTORS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -E '^- refactor' || true)
            if [ -n "$REFACTORS" ]; then
              echo "#### ♻️ Refactors" >> RELEASE_NOTES.md
              echo "$REFACTORS" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
            fi

            # Docs
            DOCS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -E '^- docs' || true)
            if [ -n "$DOCS" ]; then
              echo "#### 📚 Documentation" >> RELEASE_NOTES.md
              echo "$DOCS" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
            fi

            # Tests
            TESTS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -E '^- test' || true)
            if [ -n "$TESTS" ]; then
              echo "#### 🧪 Tests" >> RELEASE_NOTES.md
              echo "$TESTS" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
            fi

            # Chores (excluding release commits)
            CHORES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | grep -E '^- chore' | grep -v 'release' || true)
            if [ -n "$CHORES" ]; then
              echo "#### 🔧 Chores" >> RELEASE_NOTES.md
              echo "$CHORES" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
            fi

            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG_NAME}" >> RELEASE_NOTES.md
          else
            echo "Initial release 🎉" >> RELEASE_NOTES.md
          fi

          cat RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          TITLE="${PKG_NAME}@${PKG_VERSION}"

          if gh release view "$TAG_NAME" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
